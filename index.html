<!doctype html>
<html lang="ru" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1c1a16" />
    <meta name="description" content="web-gradebook — офлайн-журнал преподавателя" />
    <title>web-gradebook</title>
    <script>
      // Тема применяется до первой отрисовки, чтобы не было вспышки.
      (function () {
        try {
          var raw = localStorage.getItem('web-gradebook:settings');
          var mode = raw ? JSON.parse(raw).theme : 'system';
          var dark =
            mode === 'dark' ||
            ((mode === 'system' || !mode) && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        } catch (error) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
